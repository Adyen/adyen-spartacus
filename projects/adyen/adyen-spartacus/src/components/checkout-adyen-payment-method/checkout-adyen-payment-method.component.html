<h2 class="cx-checkout-title d-none d-lg-block d-xl-block">
  {{ 'paymentForm.payment' | cxTranslate }}
</h2>

<cx-adyen-delivery-address
  (setBillingAddress)="setBillingAddress($event)"
  (billingCountryChanged)="onBillingCountryChange($event)"
/>

@if (showInlineDisclaimer && checkoutConfig?.disclaimerMessage) {
  <p class="adyen-disclaimer">{{ checkoutConfig.disclaimerMessage }}</p>
}

<div class="payment-container">
  <div #hook id="dropin" class="payment"></div>
</div>
